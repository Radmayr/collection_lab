[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "collection_lab"
dynamic = ["version"]
description = "Инструменты для разработки, отбора признаков и валидации ML-моделей"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Radmuire" }]
dependencies = [
    "numpy>=1.23",
    "pandas>=2.0",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "lightgbm>=4.0",
    "plotly>=5.15",
    "joblib>=1.2",
    "tqdm>=4.64",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
optuna = ["optuna>=3.0"]
clearml = ["clearml>=1.14"]
all = ["collection_lab[catboost,optuna,clearml]"]
report = ["nbformat>=5.0", "nbconvert>=7.0", "ipykernel"]
dev = [
    "collection_lab[all,report]",
    "pytest>=7.0",
    "ruff>=0.5",
    "nbformat>=5.0",
    "ipykernel",
]

[tool.setuptools.dynamic]
version = { attr = "collection_lab.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: долгие тесты на реальных данных (запуск: pytest -m slow)",
]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["reports/rtk_report.ipynb"]  # собирается из build_rtk_report.py

[tool.ruff.lint.per-file-ignores]
"reports/build_rtk_report.py" = ["E501"]  # код ячеек отчёта: длинные строки подписей графиков

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PD"]
